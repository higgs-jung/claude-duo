name: Publish to npm

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release target
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag_name="${{ github.event.release.tag_name }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_name="$GITHUB_REF_NAME"
          else
            tag_name=""
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "tag_version=${tag_name#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: steps.release.outputs.tag_name != ''
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ steps.release.outputs.tag_version }}" != "$package_version" ]; then
            echo "Tag version (${{ steps.release.outputs.tag_version }}) does not match package.json ($package_version)."
            exit 1
          fi

      - name: Check whether version is already published
        id: npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already on npm."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
