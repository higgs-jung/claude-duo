<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude Code Orchestration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .controls {
      background: #2d2d30;
      border-bottom: 1px solid #3e3e3e;
      padding: 8px 16px;
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 13px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      color: #ccc;
      font-size: 12px;
    }

    .control-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .control-group input[type="number"] {
      width: 60px;
      padding: 4px 8px;
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 3px;
      color: #fff;
      font-size: 12px;
    }

    .control-group input[type="number"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .turn-counter {
      color: #4ec9b0;
      font-weight: 500;
      margin-left: auto;
    }

    .turn-counter.warning {
      color: #ce9178;
    }

    .turn-counter.danger {
      color: #f48771;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .terminal-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e3e;
    }

    .terminal-wrapper:last-child {
      border-right: none;
    }

    .terminal-header {
      background: #252526;
      padding: 8px 12px;
      border-bottom: 1px solid #3e3e3e;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-title {
      font-weight: 500;
    }

    .terminal-status {
      font-size: 11px;
      color: #888;
    }

    .terminal-status.running {
      color: #4ec9b0;
    }

    .terminal-content {
      flex: 1;
      padding: 8px;
      overflow: hidden;
    }

    .terminal {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="control-group">
      <input type="checkbox" id="turnLimitEnabled" checked>
      <label for="turnLimitEnabled">Turn Limit</label>
    </div>
    <div class="control-group">
      <label for="maxTurns">Max Turns:</label>
      <input type="number" id="maxTurns" value="10" min="1" max="100">
    </div>
    <div class="control-group">
      <label for="cooldownMs">Cooldown (ms):</label>
      <input type="number" id="cooldownMs" value="3000" min="0" max="10000" step="100">
    </div>
    <div class="turn-counter" id="turnCounter">0 / 10 turns</div>
  </div>

  <div class="container">
    <div class="terminal-wrapper">
      <div class="terminal-header">
        <span class="terminal-title">Terminal A</span>
        <span class="terminal-status" id="status-a">Ready</span>
      </div>
      <div class="terminal-content">
        <div id="terminal-a" class="terminal"></div>
      </div>
    </div>

    <div class="terminal-wrapper">
      <div class="terminal-header">
        <span class="terminal-title">Terminal B</span>
        <span class="terminal-status" id="status-b">Ready</span>
      </div>
      <div class="terminal-content">
        <div id="terminal-b" class="terminal"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="client.js"></script>
</body>
</html>
